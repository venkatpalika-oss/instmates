<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Technician Profiles | InstMates</title>

  <meta name="description"
        content="Browse instrument and analyzer technician profiles on InstMates." />

  <!-- ================= GLOBAL CSS ================= -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/instmates-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<div id="siteHeader"></div>

<main class="container">

  <!-- ================= PAGE INTRO ================= -->

    <h2>Technician Profiles</h2>
    <p class="muted">
      Discover instrument & analyzer professionals from across industries.
    </p>
  </section>

  <!-- ================= SEARCH BAR ================= -->
  <section class="panel" style="margin-top:16px;">
    <input
      type="text"
      id="profileSearch"
      placeholder="Search by name, role, skill, or location..."

        width:100%;
        padding:12px 14px;
        border-radius:8px;
        border:1px solid #ddd;
        font-size:15px;
      "
    />
  </section>

  <!-- ================= PROFILES GRID ================= -->
  <section id="profilesGrid" class="grid grid-3" style="margin-top:20px;">
    <p class="muted">Loading profiles…</p>
  </section>

</main>

<!-- ================= FOOTER ================= -->
<div id="siteFooter"></div>

<!-- ================= SCRIPTS ================= -->

<!-- Header & Footer Includes -->
