<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 1440 365" role="img" aria-labelledby="title desc">
<title id="title">Natural gas metering skid — conceptual equipment overview</title><desc id="desc">A main pipeline runs left to right through isolation, a separator, flow conditioning and metering to an outlet. A distinct sample branch leads to the sample system and gas chromatograph. Dashed information connections lead from measurement equipment to a separate flow computer. This is not an installation or piping schematic. All models are inactive.</desc>
