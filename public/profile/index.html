<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Technician Profile | InstMates</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/assets/css/style.css?v=2026-02-22-5" />

  <style>
    .profile-hero {
      display:flex;
      gap:25px;
      align-items:center;
      margin-bottom:30px;
      flex-wrap:wrap;
      background:#f4f8fb;
      padding:25px;
      border-radius:16px;
      transition:0.3s ease;
    }
    .profile-hero:hover {
      transform:translateY(-4px);
      box-shadow:0 12px 30px rgba(0,0,0,0.08);
    }
    .profile-avatar {
      width:120px;
      height:120px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid #fff;
      box-shadow:0 8px 25px rgba(0,0,0,0.08);
    }
    .headline { margin:5px 0; font-weight:500; }

    .verified-badge {
      display:inline-block;
      margin-left:10px;
      padding:4px 10px;
      font-size:12px;
      background:#e7f1ff;
      color:#0d6efd;
      border-radius:20px;
      font-weight:500;
    }

    .profile-strength-wrapper {
      margin-top:10px;
      max-width:350px;
    }
    .profile-strength-header {
      display:flex;
      justify-content:space-between;
      font-size:13px;
      margin-bottom:6px;
      color:#555;
    }
    .profile-strength-bar {
      height:8px;
      background:#e0e0e0;
      border-radius:20px;
      overflow:hidden;
    }
    .profile-strength-fill {
      height:100%;
      background:linear-gradient(90deg,#28a745,#0d6efd);
      border-radius:20px;
      transition:width 0.4s ease;
    }


    .profile-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:40px;
    }
    @media(max-width:900px){
      .profile-grid { grid-template-columns:1fr; }
    }

    .analyzer-tags { display:flex; flex-wrap:wrap; gap:8px; }
    .analyzer-tags .tag {
      display:inline-block;
      padding:4px 10px;
      border-radius:20px;
      background:#eef3f8;
      font-size:13px;
    }

  </style>
  <link rel="canonical" href="https://www.instmates.com/profile/" />
</head>

<body data-page="technician-profile">

<div id="siteHeader"></div>

<nav class="crumbs">
  <a href="/">Home</a><span>›</span>
  <a href="/profiles/">Profiles</a><span>›</span>
  <span class="current">Technician Profile</span>
</nav>

<main class="container">
<section id="profileContainer" class="panel">
  <p class="muted">Loading profile…</p>
</section>
</main>

<div id="siteFooter"></div>
<script src="/assets/js/includes.js?v=2026-02-22-5"></script>

<script type="module">
/* W0.1: all profile data is rendered through DOM APIs (textContent /
   setAttribute) via /assets/js/safe-html.js. Nothing from Firestore is
   ever parsed as HTML on this page.
   W0.8: the previous hard-coded "Analyzer Uptime / Shutdowns Supported /
   Breakdowns Resolved" counters and the client-computed "Authority Score"
   were removed - they were fixed literals, not member data. */
import { db } from "/assets/js/firebase.js";
import { doc, getDoc }
  from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
import { h, render, safeStorageUrl } from "/assets/js/safe-html.js";

const container = document.getElementById("profileContainer");
const uid = new URLSearchParams(window.location.search).get("uid");

if (!uid) {
  render(container, h("p", { class: "muted" }, "Profile not found."));
} else {
  loadProfile(uid).catch((err) => {
    console.error("Profile load error:", err);
    const denied = err && (err.code === "permission-denied");
    render(container, h("p", { class: "muted" },
      denied ? "This profile is private." : "Failed to load profile."));
  });
}

function asString(value, max = 300) {
  return typeof value === "string" ? value.slice(0, max) : "";
}

function asStringList(value, max = 50) {
  return Array.isArray(value)
    ? value.filter((v) => typeof v === "string").slice(0, max)
    : [];
}

async function loadProfile(uid) {
  const snap = await getDoc(doc(db, "profiles", uid));
  if (!snap.exists()) {
    render(container, h("p", { class: "muted" }, "Profile not found."));
    return;
  }

  const p = snap.data() || {};
  const basic = (p.basicInfo && typeof p.basicInfo === "object") ? p.basicInfo : {};
  const professional = (p.professional && typeof p.professional === "object") ? p.professional : {};
  const achievement = (p.achievement && typeof p.achievement === "object") ? p.achievement : {};
  const status = (p.profileStatus && typeof p.profileStatus === "object") ? p.profileStatus : {};

  // ===== BACKWARD COMPATIBILITY (old flat schema) =====
  const displayName = asString(basic.fullName, 100) || asString(p.fullName, 100) || "Technician";
  const displayHeadline = asString(basic.headline, 150) || asString(p.role, 150);
  const displayLocation = asString(basic.location, 100) || asString(p.location, 100);
  const displayPhoto = safeStorageUrl(basic.profilePhoto || p.photoURL, "");
  const displaySpecialization = asString(professional.specialization, 150) || asString(p.primaryDomain, 150);
  const plantType = asString(professional.plantType, 100);
  const analyzersList = asStringList(professional.analyzersWorked).length
    ? asStringList(professional.analyzersWorked)
    : asStringList(p.skills);
  const experienceYears = Number.isFinite(Number(basic.experienceYears))
    ? Math.max(0, Math.min(60, Math.floor(Number(basic.experienceYears))))
    : 0;

  // Privacy is enforced by Firestore rules (a private profile is denied
  // before we get here); this check only handles the owner viewing their
  // own private profile and legacy documents.
  const isPublic = status.isPublic !== undefined ? status.isPublic === true : (p.publicProfile !== false);
  if (!isPublic) {
    render(container, h("p", { class: "muted" }, "This profile is private."));
    return;
  }

  let completionPercent = Number(status.completionPercent);
  if (!Number.isFinite(completionPercent)) {
    let total = 6, score = 0;
    if (displayName !== "Technician") score++;
    if (displayHeadline) score++;
    if (displayLocation) score++;
    if (displaySpecialization) score++;
    if (analyzersList.length > 0) score++;
    if (achievement.title || p.majorTroubleshooting) score++;
    completionPercent = Math.round((score / total) * 100);
  }
  completionPercent = Math.max(0, Math.min(100, Math.round(completionPercent)));

  // ===== HERO =====
  const avatar = displayPhoto
    ? h("img", { src: displayPhoto, class: "profile-avatar", alt: "" })
    : h("div", { class: "profile-avatar", "aria-hidden": "true",
        style: "display:flex;align-items:center;justify-content:center;background:#e7eef5;font-size:40px;font-weight:700;color:#0b3c5d;" },
        displayName.trim().charAt(0).toUpperCase() || "T");

  const heading = h("h1", {}, displayName);
  if (p.isVerified === true) {
    heading.appendChild(document.createTextNode(" "));
    heading.appendChild(h("span", { class: "verified-badge" }, "✔ Verified"));
  }

  const strength = h("div", { class: "profile-strength-wrapper" },
    h("div", { class: "profile-strength-header" },
      h("span", {}, "Profile Strength"),
      h("span", {}, completionPercent + "%")),
    h("div", { class: "profile-strength-bar" },
      h("div", { class: "profile-strength-fill", style: "width:" + completionPercent + "%" })));

  const hero = h("div", { class: "profile-hero" },
    avatar,
    h("div", {},
      heading,
      displayHeadline ? h("p", { class: "headline" }, displayHeadline) : null,
      h("p", { class: "muted" },
        displayLocation ? "📍 " + displayLocation + "  |  " : "",
        "⏳ " + experienceYears + (experienceYears === 1 ? " Year" : " Years") + " Experience"),
      strength));

  // ===== DETAILS =====
  const left = h("div", {},
    h("h3", {}, "Specialization"),
    h("p", {}, displaySpecialization || "Not specified"),
    h("h3", {}, "Plant Type"),
    h("p", {}, plantType || "Not specified"));

  if (analyzersList.length) {
    left.appendChild(h("h3", {}, "Analyzers Worked"));
    left.appendChild(h("div", { class: "analyzer-tags" },
      analyzersList.map((a) => h("span", { class: "tag" }, a.slice(0, 80)))));
  }

  const right = h("div", {});
  const caseTitle = asString(achievement.title, 200);
  if (caseTitle) {
    right.appendChild(h("h3", {}, "Signature Case"));
    right.appendChild(h("div", { class: "case-card" },
      h("h4", {}, caseTitle),
      h("p", {}, h("strong", {}, "Description:"), h("br"), asString(achievement.description, 2000)),
      h("p", {}, h("strong", {}, "Impact:"), h("br"), asString(achievement.impact, 2000))));
  }

  render(container, hero, h("div", { class: "profile-grid" }, left, right));
}
</script>

</body>
</html>
